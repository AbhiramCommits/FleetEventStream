name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit + Testcontainers integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Show Docker versions
        run: |
          docker version
          docker info --format '{{.ServerVersion}} {{.Architecture}}'

      - name: Verify (unit + integration tests)
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: warn

  build:
    name: Package (tests skipped)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build deployable jar without tests
        run: ./mvnw -B -Dmaven.test.skip=true clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: fleet-event-stream-jar
          path: target/fleet-event-stream-*.jar
          if-no-files-found: error
