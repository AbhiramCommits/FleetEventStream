server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: fleet-event-stream
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:fleeteventstream};encrypt=true;trustServerCertificate=true;loginTimeout=30
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:12}
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: fleet-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: dbo
    default-schema: dbo
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        compression.type: lz4
    consumer:
      group-id: ${FLEET_CONSUMER_GROUP:fleet-event-consumers}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 100
      properties:
        max.partition.fetch.bytes: 1048576
    listener:
      type: single
      ack-mode: manual_immediate
      concurrency: ${FLEET_CONSUMER_CONCURRENCY:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

fleet:
  kafka:
    topics:
      telemetry: vehicle.telemetry
      retry: vehicle.telemetry.retry
      dlq: vehicle.telemetry.dlq
    consumer:
      group-id: ${FLEET_CONSUMER_GROUP:fleet-event-consumers}
      replay-group-id: fleet-event-replay
      concurrency: ${FLEET_CONSUMER_CONCURRENCY:3}
      max-payload-chars: 65536
    retry:
      max-attempts: 3
      initial-interval-ms: 500
      multiplier: 2.0
  simulator:
    events-per-second: 50
    vehicle-count: 10
    malformed-rate: 0.02
    duration-seconds: 0
  health:
    max-lag: 5000
  replay:
    max-records: 100000

logging:
  level:
    com.fleeteventstream: INFO
    org.apache.kafka: WARN

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:sqlserver://${DB_HOST:sqlserver}:${DB_PORT:1433};databaseName=${DB_NAME:fleeteventstream};encrypt=true;trustServerCertificate=true;loginTimeout=60
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

fleet:
  simulator:
    events-per-second: ${FLEET_SIM_EPS:50}
    vehicle-count: ${FLEET_SIM_VEHICLES:10}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:fleeteventstream_test};encrypt=true;trustServerCertificate=true
  kafka:
    listener:
      auto-startup: ${FLEET_LISTENER_AUTO_STARTUP:true}

fleet:
  simulator:
    events-per-second: 20
    vehicle-count: 5
    malformed-rate: 0.05
  health:
    max-lag: 10000
